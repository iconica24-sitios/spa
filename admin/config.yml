# =========================================================================
# Panel de edición (Decap CMS) — plantilla de bloques "Spa" de Icónica24
# -------------------------------------------------------------------------
# - "Sitio": nombre, datos del negocio, color de acento, menú, botón y pie.
#   Es uno para todo el sitio (contenido/sitio.json).
# - "Página de inicio": sus bloques, que se agregan, quitan y ordenan
#   (contenido/inicio.json).
# - "Páginas": páginas nuevas que crea el cliente, también con bloques
#   (contenido/paginas/<nombre>.json → /<nombre>/). El nombre sale del
#   título al crearla y ya no cambia, para no romper enlaces.
# Los tipos de bloque no se escriben aquí: salen de bloques/<tipo>/campos.json
# y el build los pone donde dice "@bloques".
# La conexión con GitHub (repo, inicio de sesión) la pone admin/index.html.
# =========================================================================
backend:
  name: github
  branch: main
  commit_messages:
    update: "Contenido: actualiza {{slug}} desde el panel"
    uploadMedia: "Contenido: sube {{path}}"
    deleteMedia: "Contenido: borra {{path}}"

locale: es

# Direcciones de páginas nuevas sin acentos ni símbolos: "Quiénes somos" → quienes-somos
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

media_folder: imagenes
public_folder: /imagenes

collections:
  - name: inicio
    label: Página de inicio
    delete: false
    files:
      - name: inicio
        label: Inicio
        file: contenido/inicio.json
        fields:
          - label: Buscadores (Google)
            name: seo
            widget: object
            collapsed: true
            fields:
              - { label: "Título de la pestaña", name: titulo, widget: string, pattern: ['^.{1,70}$', "Máximo 70 caracteres"] }
              - { label: "Descripción en Google", name: descripcion, widget: text, pattern: ['^[\s\S]{1,170}$', "Máximo 170 caracteres"] }
          - label: Bloques
            name: bloques
            label_singular: bloque
            widget: list
            typeKey: tipo
            collapsed: true
            hint: "Agrega, quita y ordena los bloques de la página. Cada bloque trae su diseño; sólo cambias el contenido."
            types: "@bloques"

  - name: paginas
    label: Páginas
    label_singular: página
    description: "Páginas nuevas del sitio, armadas con los mismos bloques. Para que aparezcan en el menú, agrégalas en Sitio → Menú."
    folder: contenido/paginas
    extension: json
    format: json
    create: true
    delete: true
    identifier_field: titulo
    slug: "{{slug}}"
    summary: "{{titulo}}"
    fields:
      - { label: "Título de la página", name: titulo, widget: string, pattern: ['^.{1,60}$', "Máximo 60 caracteres"], hint: "Al crear la página, de aquí sale su dirección: «Nuestros servicios» → /nuestros-servicios. Después la dirección ya no cambia." }
      - label: Buscadores (Google)
        name: seo
        widget: object
        collapsed: true
        required: false
        fields:
          - { label: "Título de la pestaña", name: titulo, widget: string, required: false, hint: "Vacío = «Título de la página · Nombre del negocio».", pattern: ['^.{0,70}$', "Máximo 70 caracteres"] }
          - { label: "Descripción en Google", name: descripcion, widget: text, required: false, pattern: ['^[\s\S]{0,170}$', "Máximo 170 caracteres"] }
      - label: Bloques
        name: bloques
        label_singular: bloque
        widget: list
        typeKey: tipo
        collapsed: true
        hint: "Agrega, quita y ordena los bloques de la página. Cada bloque trae su diseño; sólo cambias el contenido."
        types: "@bloques"

  - name: sitio
    label: Sitio
    delete: false
    files:
      - name: sitio
        label: Datos del negocio, menú y pie
        file: contenido/sitio.json
        fields:
          - { label: "Nombre del negocio", name: nombre, widget: string, hint: "Aparece en la cabecera y en el pie." }
          - label: Datos del negocio
            name: negocio
            widget: object
            hint: "Se usan en el menú del celular, en Reservaciones y en el pie."
            fields:
              - { label: "Teléfono", name: telefono, widget: string, hint: "10 dígitos, como quieras que se lea (55 1234 5678). El enlace para llamar se arma solo.", pattern: ['^\D*(\d\D*){10}$', "Deben ser 10 dígitos"] }
              - { label: "WhatsApp", name: whatsapp, widget: string, hint: "10 dígitos. Es a donde lleva el botón de Reservaciones.", pattern: ['^\D*(\d\D*){10}$', "Deben ser 10 dígitos"] }
              - { label: "Correo", name: correo, widget: string, pattern: ['^[^@\s]+@[^@\s]+\.[^@\s]+$', "Escribe un correo válido"] }
              - { label: "Dirección", name: direccion, widget: text, hint: "Cada renglón se respeta tal cual." }
              - { label: "Días de atención (menú del celular)", name: dias, widget: string }
          - label: Marca
            name: marca
            widget: object
            collapsed: true
            fields:
              - { label: "Color de acento", name: acento, widget: color, hint: "Botones, rótulos, íconos y detalles." }
          - label: Menú
            name: menu
            label_singular: opción
            widget: list
            max: 7
            summary: "{{fields.texto}}"
            hint: "Arrastra para ordenar. Aparece en la cabecera, en el menú del celular y en el pie."
            fields:
              - { label: "Texto", name: texto, widget: string, pattern: ['^.{1,24}$', "Máximo 24 caracteres"] }
              - { label: "Página", name: pagina, widget: relation, collection: paginas, value_field: "{{slug}}", search_fields: [titulo], display_fields: [titulo], required: false, hint: "Elige una página del sitio… (si se borra la página, la opción se quita sola)" }
              - { label: "…o una dirección", name: enlace, widget: string, required: false, hint: "Si no elegiste página: #ancla de un bloque de inicio (p. ej. #precios), /algo o https://…", pattern: ['^(|#[a-z0-9-]*|/.*|https?://.+|mailto:.+|tel:.+)$', "Empieza con #, / o https://"] }
          - label: Botón de reservar
            name: boton
            widget: object
            collapsed: true
            fields:
              - { label: "Texto en la cabecera", name: texto, widget: string, required: false, hint: "Vacío = sin botón" }
              - { label: "Texto en el menú del celular", name: texto_movil, widget: string, required: false }
              - { label: "Página", name: pagina, widget: relation, collection: paginas, value_field: "{{slug}}", search_fields: [titulo], display_fields: [titulo], required: false, hint: "Elige una página del sitio… (si se borra la página, la opción se quita sola)" }
              - { label: "…o una dirección", name: enlace, widget: string, required: false, hint: "Si no elegiste página: #ancla de un bloque de inicio (p. ej. #precios), /algo o https://…", pattern: ['^(|#[a-z0-9-]*|/.*|https?://.+|mailto:.+|tel:.+)$', "Empieza con #, / o https://"] }
          - label: Pie de página
            name: pie
            widget: object
            collapsed: true
            fields:
              - { label: "Dirección completa", name: direccion, widget: text, hint: "Cada renglón se respeta tal cual." }
              - { label: "Título de horarios", name: titulo_horarios, widget: string }
              - { label: "Horarios", name: horarios, widget: text, hint: "Cada renglón se respeta tal cual." }
              - { label: "Título del menú", name: titulo_explora, widget: string }
              - { label: "Aviso legal", name: legal, widget: string }
