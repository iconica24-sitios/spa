<section class="seccion fondo-arena reserva" id="" data-cms-id=".ancla" data-cms-item>
  <div class="contenedor reticula rg-48">
    <div class="reserva__info">
      <h2 class="t t-h2 serif" data-cms=".titulo">Título</h2>
      <p class="t t-ld gris" data-cms=".texto" data-cms-optional>Texto</p>
      <div class="contacto">
        <div><span class="t t-icono" aria-hidden="true">📍</span><div><p class="t t-md" data-cms=".rotulo_direccion">Dónde estamos</p><p class="t t-cuerpo gris" data-cms="@sitio.negocio.direccion">Dirección</p></div></div>
        <div><span class="t t-icono" aria-hidden="true">📞</span><div><p class="t t-md" data-cms=".rotulo_telefono">Teléfono</p><p class="t t-cuerpo gris"><a href="#" data-cms-href="tel:+52{@sitio.negocio.telefono|digitos}" data-cms="@sitio.negocio.telefono">Teléfono</a></p></div></div>
        <div><span class="t t-icono" aria-hidden="true">✉</span><div><p class="t t-md" data-cms=".rotulo_correo">Correo</p><p class="t t-cuerpo gris"><a href="#" data-cms-href="mailto:{@sitio.negocio.correo}" data-cms="@sitio.negocio.correo">Correo</a></p></div></div>
        <div><span class="t t-icono" aria-hidden="true">🕑</span><div><p class="t t-md" data-cms=".rotulo_horarios">Horarios</p><p class="t t-cuerpo gris" data-cms=".horarios">Horarios</p></div></div>
      </div>
    </div>
    <div class="reserva__tarjeta">
      <h3 class="t t-20 serif" data-cms=".tarjeta_titulo">Pide tu cita</h3>
      <p class="t t-cuerpo gris" data-cms=".tarjeta_texto">Texto</p>
      <a class="boton boton--reserva" href="#" data-cms-href="https://wa.me/52{@sitio.negocio.whatsapp|digitos}" target="_blank" rel="noopener"><span data-cms=".tarjeta_boton">Reservar</span></a>
    </div>
  </div>
</section>
