<section class="poster" id="" data-cms-id=".ancla" data-cms-item>
  <div class="encabezado poster__encabezado" data-cms-if=".titulo">
    <p class="rotulo" data-cms=".rotulo" data-cms-optional>Póster</p>
    <h2 class="titulo-seccion" data-cms=".titulo">Una imagen que se explica por partes.</h2>
    <p class="texto-seccion" data-cms=".texto" data-cms-optional>Una línea que presente la imagen y lo que señalan las notas.</p>
  </div>
  <div class="poster__lienzo rayado">
    <img class="poster__imagen" src="/imagenes/spa-piedras.webp" alt="" loading="lazy" data-cms-src=".imagen" data-cms-alt=".descripcion" data-cms-if=".imagen">
    <ol class="poster__notas" data-cms-list=".elementos">
      <li class="poster__nota" style="--alto:50" data-cms-class="poster__nota--izquierda: .lado=izquierda" data-cms-style="--alto:{.altura}" data-cms-item><span class="poster__nota-texto" data-cms=".texto">Primera nota. Señala un detalle de la imagen.</span></li>
    </ol>
  </div>
</section>
